<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="favBorder" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="favBg" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#070e1b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="favArcGrad" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="favMetalBase" x1="44" y1="72" x2="56" y2="87">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="favDropGrad" x1="33" y1="24" x2="67" y2="72">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="favSproutGrad" x1="43" y1="38" x2="57" y2="64">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>

  <!-- Container background with rounded squircle and glowing border -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#favBg)" stroke="url(#favBorder)" stroke-width="3" />
  
  <!-- Subtle ambient glow -->
  <circle cx="50" cy="50" r="32" fill="#0ea5e9" opacity="0.18" />

  <!-- Rotary Sprinkler + Hydro Droplet + Growth Sprout (Matching AquaFlow Logo) -->
  <circle cx="50" cy="50" r="40" stroke="url(#favArcGrad)" stroke-width="2.5" stroke-dasharray="3 4" opacity="0.45" />
  <path d="M50 14 C32 14 18 28 16 48" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3" />
  <path d="M50 14 C68 14 82 28 84 48" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3" />
  <rect x="44" y="72" width="12" height="15" rx="3" fill="url(#favMetalBase)" />
  <path d="M40 85 L60 85" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
  <path d="M50 24 C50 24 33 43 33 55 C33 64.3888 40.6112 72 50 72 C59.3888 72 67 64.3888 67 55 C67 43 50 24 50 24Z" fill="url(#favDropGrad)" />
  <path d="M50 64 C50 64 57 58 57 50 C57 44 51 40 50 38 C49 40 43 44 43 50 C43 58 50 64 50 64Z" fill="url(#favSproutGrad)" />
  <path d="M50 40 L50 60" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />
  <ellipse cx="43" cy="48" rx="3.5" ry="6" transform="rotate(-25 43 48)" fill="#ffffff" opacity="0.65" />
